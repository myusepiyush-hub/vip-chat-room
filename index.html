<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PopX Pro - Supabase Cloud V23</title>
  
  <!-- ========================================== -->
  <!-- 🛰️ SUPABASE CLOUD CORE ENGINE MODULE JS -->
  <!-- ========================================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ========================================== */
    /* 🎨 MASTER THEME CONFIGURATION AND VARIABLES */
    /* ========================================== */
    :root { 
      --bg: #000; 
      --text: #fff; 
      --accent: #0095f6; 
      --card: #121212; 
      --border: #262626; 
      --ig-gray: #a8a8a8; 
      --neon-cyan: #00f2fe; 
      --neon-glow: none; 
    }
    
    .neon-theme { 
      --bg: #0a0f1d; 
      --card: #131c33; 
      --border: #00f2fe; 
      --accent: #ff007f; 
      --neon-glow: 0 0 10px #00f2fe; 
    }
    
    *, *::before, *::after { 
      box-sizing: border-box; 
    }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      overflow: hidden; 
      transition: all 0.3s ease; 
    }
    
    /* ========================================== */
    /* 🔐 AUTHENTICATION PORTAL STYLING FRAMEWORK */
    /* ========================================== */
    #auth-screen { 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      padding: 30px; 
      background: #000; 
      z-index: 5000; 
      position: relative; 
    }
    
    .auth-card { 
      width: 100%; 
      max-width: 350px; 
      text-align: center; 
    }
    
    .auth-input { 
      width: 100%; 
      background: #1c1c1e; 
      border: 1px solid #333; 
      color: white; 
      padding: 14px; 
      border-radius: 10px; 
      margin-bottom: 12px; 
      font-size: 14px; 
      outline: none; 
    }
    
    .auth-btn-login { 
      width: 100%; 
      background: #0095f6; 
      border: none; 
      color: white; 
      padding: 14px; 
      border-radius: 10px; 
      font-weight: bold; 
      font-size: 15px; 
      cursor: pointer; 
      margin-bottom: 11px; 
      display: block; 
      text-align: center; 
      box-shadow: 0 4px 10px rgba(0, 149, 246, 0.3);
    }
    
    .auth-btn-login:active { 
      background: #0077c2; 
    }
    
    .auth-btn-signup { 
      width: 100%; 
      background: #262626; 
      border: 1px solid #333; 
      color: white; 
      padding: 14px; 
      border-radius: 10px; 
      font-weight: bold; 
      font-size: 15px; 
      cursor: pointer; 
      display: block; 
      text-align: center; 
    }
    
    .auth-btn-signup:active { 
      background: #1c1c1e; 
    }

    /* ========================================== */
    /* 📱 ECOSYSTEM PAGES AND STRUCTURAL FRAMEWORK */
    /* ========================================== */
    #main-app-framework { 
      display: none; 
    }
    
    .page { 
      height: calc(100vh - 60px); 
      overflow-y: auto; 
      box-sizing: border-box; 
      display: none; 
    }
    
    #home-page { 
      display: block; 
    }
    
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 10px 15px; 
      background: var(--bg); 
      position: sticky; 
      top: 0; 
      z-index: 2000; 
      height: 50px; 
      border-bottom: 1px solid var(--border); 
      box-shadow: var(--neon-glow); 
    }
    
    .profile-top-bar { 
      font-weight: bold; 
      font-size: 22px; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      cursor: pointer; 
    }
    
    .bottom-nav { 
      position: fixed; 
      bottom: 0; 
      width: 100%; 
      background: var(--bg); 
      border-top: 1px solid var(--border); 
      display: flex; 
      justify-content: space-around; 
      padding: 12px 0; 
      font-size: 24px; 
      z-index: 2000; 
      height: 60px; 
      box-shadow: var(--neon-glow); 
    }
    
    .nav-btn { 
      cursor: pointer; 
      transition: transform 0.2s; 
    }
    
    .nav-btn:active {
      transform: scale(0.85);
    }

    /* ========================================== */
    /* 📰 DYNAMIC FEED AND CONTENT SYSTEM LAYOUT */
    /* ========================================== */
    .stories-bar { 
      display: flex; 
      gap: 12px; 
      padding: 12px; 
      overflow-x: auto; 
      border-bottom: 1px solid #1c1c1e; 
      align-items: center; 
    }
    
    .story-ring { 
      width: 58px; 
      height: 58px; 
      border-radius: 50%; 
      border: 2px solid #dc2743; 
      padding: 2px; 
      flex-shrink: 0; 
      cursor: pointer; 
    }
    
    .story-user { 
      width: 100%; 
      height: 100%; 
      border-radius: 50%; 
      background: #333; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-size: 20px; 
      background-size: cover; 
      background-position: center; 
    }
    
    .post-card { 
      padding: 15px 0; 
      border-bottom: 1px solid #1c1c1e; 
      position: relative; 
    }
    
    .post-header { 
      display: flex; 
      align-items: center; 
      padding: 0 15px 10px 15px; 
      font-weight: bold; 
      font-size: 14px; 
    }
    
    .post-avatar { 
      width: 32px; 
      height: 32px; 
      border-radius: 50%; 
      background: #262626; 
      margin-right: 10px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }
    
    .img-container { 
      position: relative; 
      width: 100%; 
      cursor: pointer; 
      background: #050505; 
    }
    
    .post-img { 
      width: 100%; 
      display: block; 
      object-fit: contain; 
      max-height: 450px; 
    }
    
    .post-actions { 
      padding: 10px 15px 5px 15px; 
      display: flex; 
      justify-content: space-between; 
      font-size: 22px; 
    }
    
    .action-left { 
      display: flex; 
      gap: 18px; 
      align-items: center; 
    }
    
    .blue-tick { 
      color: #0095f6; 
      font-size: 14px; 
      margin-left: 3px; 
      display: inline; 
    }
    
    .post-location { 
      font-size: 11px; 
      color: var(--ig-gray); 
      font-weight: normal; 
      margin-top: 2px; 
    }
    
    /* ========================================== */
    /* 🔎 SEARCH PEOPLE REAL STYLE FRAMEWORK */
    /* ========================================== */
    .search-container-box { padding: 15px; background: var(--bg); }
    .search-bar-input { width: 100%; background: #1c1c1e; border: 1px solid #333; color: #fff; padding: 12px 15px; border-radius: 10px; font-size: 14px; outline: none; margin-bottom: 15px; }
    .search-results-list { display: flex; flex-direction: column; gap: 12px; }
    .search-user-card { display: flex; align-items: center; background: #121212; padding: 10px 15px; border-radius: 10px; border: 1px solid #1c1c1e; cursor: pointer; }
    .search-user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #262626; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; margin-right: 12px; color: var(--accent); }
    .search-user-info { text-align: left; flex: 1; }
    .search-user-name { font-weight: bold; font-size: 14px; color: #fff; }
    .search-user-status { font-size: 11px; color: #888; }
    
    /* ========================================== */
    /* 🎟️ SUBSCRIPTION PREMIUM VAULT LAYERS */
    /* ========================================== */
    .vault-lock-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 5; color: #fff; padding: 20px; }
    .premium-badge { background: linear-gradient(45deg, #ffd700, #ffa500); color: #000; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 8px; }
    .tip-btn { background: #1c1c1e; border: 1px solid #333; color: #ffd700; font-size: 12px; font-weight: bold; padding: 5px 10px; border-radius: 15px; cursor: pointer; }

    /* 🔍 EXPLORE DISCOVERY GRID SYSTEM */
    .explore-grid-premium { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 130px; gap: 4px; padding: 4px; }
    .exp-item { background-size: cover; background-position: center; background-color: #121212; position: relative; border-radius: 4px; }
    .exp-item.tall { grid-row: span 2; }

    /* 💬 COMMENT ARCHITECTURE LAYER */
    .comment-box { background: #121212; padding: 10px; margin: 10px 15px; border-radius: 8px; border: 1px solid var(--border); display: none; }
    .comment-list { max-height: 120px; overflow-y: auto; font-size: 13px; margin-bottom: 8px; text-align: left; }
    .comment-item { margin-bottom: 6px; color: #fff; }
    .comment-input-div { display: flex; gap: 8px; }
    .comment-input-div input { flex: 1; background: #1c1c1e; border: 1px solid #333; color: white; padding: 8px; border-radius: 6px; }
    .comment-input-div button { background: var(--accent); border: none; color: white; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* 📨 MESSENGER ENGINE & VOICE TONE ENCRYPTION */
    .dm-chat-box { padding: 15px; height: calc(100vh - 120px); display: flex; flex-direction: column; justify-content: space-between; }
    .voice-changer-bar { background: #1c1c1e; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-around; font-size: 13px; }
    .voice-btn { background: #262626; border: none; color: white; padding: 5px 10px; border-radius: 12px; cursor: pointer; }
    .voice-btn.active { background: var(--accent); }

    /* 📸 STORY VIEWER MODULE */
    .story-viewer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 4000; display: none; justify-content: center; align-items: center; }
    .story-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .story-progress { position: absolute; top: 15px; left: 5%; width: 90%; height: 3px; background: #333; border-radius: 2px; overflow: hidden; }
    .story-progress-bar { width: 0%; height: 100%; background: #fff; }

    /* 👤 USER CONTROL PROFILE UI ZONE */
    .profile-header-container { padding: 15px 15px 5px 15px; }
    .profile-main-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .p-avatar-zone { width: 86px; height: 86px; border-radius: 50%; background: #262626; display: flex; justify-content: center; align-items: center; font-size: 32px; background-size: cover; background-position: center; border: 1px solid #262626; }
    .profile-stats-zone { display: flex; gap: 20px; text-align: center; flex: 1; justify-content: space-around; margin-left: 10px; }
    .stat-box { font-size: 14px; color: var(--text); }
    .stat-num { font-weight: bold; font-size: 18px; display: block; }
    .bio-text { font-size: 14px; line-height: 1.4; margin-bottom: 15px; text-align: left; }
    .mood-widget { background: #16161a; border: 1px dashed var(--neon-cyan); padding: 6px 12px; border-radius: 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; color: var(--neon-cyan); cursor: pointer; }
    .dashboard-box { background: #1c1c1e; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; border-left: 3px solid var(--neon-cyan); text-align: left; }
    .action-btn-row { display: flex; gap: 8px; margin-bottom: 15px; }
    .ig-btn { flex: 1; background: #262626; border: none; color: white; padding: 8px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .follow-btn-active { background: #0095f6 !important; color: #fff !important; }
    .tab-icon-row { display: flex; justify-content: space-around; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 10px 0; font-size: 18px; color: var(--ig-gray); }
    .tab-icon-row .active { color: white; border-bottom: 2px solid white; padding-bottom: 8px; margin-bottom: -10px; }
    .ig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; }
    .grid-item-ig { aspect-ratio: 1/1; background-color: #121212; position: relative; background-size: cover; background-position: center; border: 1px solid var(--border); }
    .grid-badge-icon { position: absolute; top: 8px; right: 8px; font-size: 12px; text-shadow: 1px 1px 3px #000; }

    /* 🎬 REELS ADVANCED STREAM CONTAINER */
    .reels-feed { height: calc(100vh - 60px); overflow-y: scroll; scroll-snap-type: y mandatory; background: #000; }
    .reel-card { height: calc(100vh - 60px); width: 100%; scroll-snap-align: start; position: relative; }
    .reel-video { width: 100%; height: 100%; object-fit: cover; }
    .reel-overlay { position: absolute; bottom: 40px; left: 15px; text-shadow: 1px 1px 5px #000; color: #fff; z-index: 10; text-align: left; }
    .audio-ticker { display: flex; align-items: center; gap: 5px; font-size: 13px; color: #fff; margin-top: 5px; }
    .ticker-wrap { overflow: hidden; width: 120px; white-space: nowrap; }
    .ticker-move { display: inline-block; animation: marquee 5s linear infinite; }
    @keyframes marquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }

    /* ➕ STUDIO CORE BROADCAST FORM CHANNELS */
    .upload-choice { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
    .choice-btn { padding: 10px 20px; background: #262626; border: none; color: white; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .choice-btn.active { background: #0095f6; }
    .upload-box { width: 85%; border: 2px dashed #333; padding: 30px 10px; border-radius: 12px; margin: 10px auto; text-align: center; background: #0a0a0a; cursor: pointer; }
    .ai-btn { background: #ff007f; border: none; color: white; padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-left: 5px; }
    .edit-modal { position: fixed; bottom: -100%; left: 0; width: 100%; height: 75vh; background: #121212; border-top: 1px solid var(--border); border-radius: 20px 20px 0 0; z-index: 3000; transition: bottom 0.3s ease-out; padding: 20px; box-sizing: border-box; }
    .edit-modal.open { bottom: 0; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 12px; color: var(--ig-gray); margin-bottom: 5px; }
    .input-group input, .input-group textarea { width: 100%; background: #1c1c1e; border: 1px solid #333; color: white; padding: 10px; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
  </style>
</head>
<body>

  <!-- ================= ⚠️ PORTAL SCREEN ================= -->
  <div id="auth-screen">
    <div class="auth-card">
      <h1 style="font-weight: bold; font-size: 38px; font-style: italic; background: linear-gradient(45deg, #f09433, #dc2743, #00f2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;">PopX Pro</h1>
      <p style="color: #a8a8a8; font-size: 14px; margin-bottom: 30px;">Supabase Cloud Core Active 🛰️</p>
      
      <input type="text" id="authUsernameInput" class="auth-input" placeholder="Enter Username / ID">
      <input type="password" id="authPasswordInput" class="auth-input" placeholder="Enter Secure Password">

      <button class="auth-btn-signup" id="signupBtnNode" onclick="handleSecureCloudAuth('signup')">Create New Account 🚀</button>
      
      <p style="color: #555; font-size: 11px; margin-top: 20px;">Powered by Supabase Cloud Systems & GitHub.</p>

  </div>

  <!-- ================= 🌐 MAIN ECOSYSTEM FRAMEWORK ================= -->
  <div id="main-app-framework">

    </div>

    <!-- 🏠 HOME SYSTEM FEED -->

        <div class="header-icons" style="font-size: 22px; display: flex; gap: 15px; align-items: center;">
          <span style="font-size:14px; background:#1c1c1e; padding:5px 10px; border-radius:15px; color:gold; font-weight: bold;">💎 125</span>

        </div>
      </div>

        <input type="file" id="storyFileInput" accept="image/*" style="display:none;" onchange="uploadStoryLocal(this)">
      </div>
      <div id="live-feed">
        <p style="text-align:center; color:#888; padding:40px; font-size:14px;">Streaming items from Supabase matrix...</p>
      </div>
    </div>

    <!-- 🔎 [REAL LOOK] INSTAGRAM STYLE SEARCH PEOPLE PAGE -->
    <div id="explore-page" class="page">
      <div class="header"><div class="logo" style="font-size:20px; font-weight: bold;">Search Engine</div></div>
      <div class="search-container-box">
        <input type="text" id="globalUserSearchInput" class="search-bar-input" placeholder="🔎 Search creators by username..." oninput="triggerLiveUserSearch(this.value)">
        <div class="search-results-list" id="searchResultsContainer">
          <p style="text-align:center; color:#555; padding:20px; font-size:13px;">Type real username above to find global members.</p>
        </div>
      </div>
    </div>

    <!-- 🎬 REELS MATRIX PLAYER -->
    <div id="reels-page" class="page" style="padding-bottom: 0;">
      <div class="reels-feed" id="reelsContainer">
        <div class="reel-card" id="defaultReelCard">
          <p style="text-align:center; color:#888; padding-top:200px;">No Reels streamed yet.</p>
        </div>
      </div>
    </div>

    <!-- ➕ CORE PRODUCTION STUDIO -->
    <div id="upload-page" class="page">
      <div class="header"><div class="logo" style="font-size:20px; font-weight: bold;">Studio Core</div></div>
      <div style="padding: 15px; text-align: center;">
        <div class="upload-choice">
          <button class="choice-btn active" id="typePostBtn" onclick="setUploadType('post')">Feed Post 🖼️</button>
          <button class="choice-btn" id="typeReelBtn" onclick="setUploadType('reel')">Reel Video 🎬</button>
        </div>
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
          <span id="uploadIcon" style="font-size:35px;">🖼️</span>
          <p id="uploadStatusText" style="margin:5px; color:#888; font-weight:bold;">Open Studio Gallery</p>
        </div>
