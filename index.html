<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PopX Pro - Creator Edition</title>
  <style>
    :root { --bg: #000; --text: #fff; --accent: #0095f6; --card: #121212; --border: #262626; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 0; user-select: none; overflow: hidden; }
    
    .page { height: calc(100vh - 60px); overflow-y: auto; box-sizing: border-box; display: none; }
    #home-page { display: block; }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--border); background: #000; position: sticky; top: 0; z-index: 2000; height: 50px; box-sizing: border-box; }
    .logo { font-weight: bold; font-size: 24px; font-style: italic; background: linear-gradient(45deg, #f09433, #dc2743); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; font-size: 24px; z-index: 2000; height: 60px; box-sizing: border-box; }
    .nav-btn { cursor: pointer; transition: transform 0.2s; }
    .nav-btn:active { transform: scale(0.8); }
    
    /* Stories */
    .stories-bar { display: flex; gap: 12px; padding: 12px; overflow-x: auto; border-bottom: 1px solid #1c1c1e; align-items: center; }
    .story-ring { width: 56px; height: 56px; border-radius: 50%; border: 2px solid #dc2743; padding: 2px; flex-shrink: 0; cursor: pointer; }
    .story-user { width: 100%; height: 100%; border-radius: 50%; background: #333; display: flex; justify-content: center; align-items: center; font-size: 20px; background-size: cover; background-position: center; }
    
    /* Posts */
    .post-card { padding: 15px 0; border-bottom: 1px solid #1c1c1e; }
    .post-header { display: flex; align-items: center; padding: 0 15px 10px 15px; font-weight: bold; font-size: 14px; }
    .post-avatar { width: 32px; height: 32px; border-radius: 50%; background: #262626; margin-right: 10px; display: flex; justify-content: center; align-items: center; }
    .post-img { width: 100%; background: #111; display: block; object-fit: contain; max-height: 450px; }
    .post-actions { padding: 10px 15px 5px 15px; display: flex; gap: 15px; font-size: 22px; }
    .blue-tick { color: #0095f6; font-size: 14px; margin-left: 3px; display: inline; }
    
    /* Reels System (Instagram Snap Style) */
    .reels-feed { height: calc(100vh - 60px); overflow-y: scroll; scroll-snap-type: y mandatory; background: #000; }
    .reel-card { height: calc(100vh - 60px); width: 100%; scroll-snap-align: start; position: relative; background: #000; }
    .reel-video { width: 100%; height: 100%; object-fit: cover; }
    .reel-overlay { position: absolute; bottom: 30px; left: 15px; z-index: 10; font-weight: bold; text-shadow: 1px 1px 5px rgba(0,0,0,0.8); color: #fff; }
    
    /* Tabs & Forms */
    .upload-choice { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
    .choice-btn { padding: 10px 20px; background: #262626; border: none; color: white; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .choice-btn.active { background: #0095f6; }
    .upload-box { width: 85%; border: 2px dashed #333; padding: 40px 10px; border-radius: 12px; margin: 20px auto; cursor: pointer; background: #0a0a0a; text-align: center; }
    
    /* Profile & Grid */
    .profile-info { padding: 20px; text-align: center; border-bottom: 1px solid var(--border); }
    .profile-avatar { width: 86px; height: 86px; border-radius: 50%; background: #262626; margin: 0 auto 12px auto; font-size: 38px; display: flex; justify-content: center; align-items: center; border: 2px solid #333; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; }
    .grid-item { aspect-ratio: 1/1; background-color: #1c1c1e; background-size: cover; background-position: center; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- १. होम फीड पेज -->
  <div id="home-page" class="page">
    <div class="header"><div class="logo">PopX Pro</div></div>
    <div class="stories-bar">
      <div class="story-ring" onclick="document.getElementById('storyFileInput').click()"><div class="story-user" id="myStoryIcon">🙋‍♂️</div></div>
      <input type="file" id="storyFileInput" accept="image/*" style="display:none;" onchange="uploadStoryLocal(this)">
      <div class="story-ring"><div class="story-user">🐱</div></div>
    </div>
    <div id="live-feed">
      <div class="post-card">
        <div class="post-header"><div class="post-avatar">👤</div><div>@piyush_creator <span class="blue-tick" id="tick-piyush_creator">🔵</span></div></div>
        <img class="post-img" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500">
        <div class="post-actions"><span style="cursor:pointer;" onclick="this.innerText = this.innerText === '❤️' ? '🤍' : '❤️'">❤️</span></div>
        <div style="padding: 0 15px; font-size: 14px;"><b>@piyush_creator</b> Master Edition Setup Live! 🎬🚀</div>
      </div>
    </div>
  </div>

  <!-- २. स्क्रोलिंग रील्स पेज -->
  <div id="reels-page" class="page" style="padding-bottom: 0;">
    <div class="reels-feed" id="reelsContainer">
      <!-- डीफॉल्ट रील -->
      <div class="reel-card">
        <video class="reel-video" src="https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-sign-light-40492-large.mp4" loop muted autoplay onclick="this.paused ? this.play() : this.pause()"></video>
        <div class="reel-overlay"><p>@piyush_creator <span class="blue-tick">🔵</span></p><span>Official PopX Reels Track! 🎬🔥</span></div>
      </div>
    </div>
  </div>

  <!-- ३. पोस्ट आणि रील अपलोड पेज -->
  <div id="upload-page" class="page">
    <div class="header"><div class="logo">Create</div></div>
    <div style="padding: 20px; text-align: center;">
      <div class="upload-choice">
        <button class="choice-btn active" id="typePostBtn" onclick="setUploadType('post')">Feed Post 🖼️</button>
        <button class="choice-btn" id="typeReelBtn" onclick="setUploadType('reel')">Reel Video 🎬</button>
      </div>

      <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <span id="uploadIcon">🖼️</span>
        <p id="uploadStatusText" style="margin:10px 0 0 0; color:#888; font-weight:bold;">Select from Gallery</p>
      </div>
      <input type="file" id="fileInput" style="display:none;" onchange="mediaSelected(this)">
      <input type="text" id="postCaption" placeholder="Write a caption..." style="width:85%; padding:14px; margin-bottom:25px; background:#1c1c1e; color:#fff; border:1px solid #333; border-radius:8px;"><br>
      <button onclick="publishMedia()" style="padding:14px 35px; background:#0095f6; border:none; color:white; border-radius:8px; font-weight:bold; width:85%; font-size:15px;">Publish Now 🚀</button>
    </div>
  </div>

  <!-- ४. प्रोफाईल पेज -->
  <div id="profile-page" class="page">
    <div class="profile-info">
      <!-- ⚠️ गुपित ट्रिक: या अवतार फोटोवर ३ वेळा क्लिक केल्यास कोणालाही ब्लू टिक देता येईल! -->
      <div class="profile-avatar" onclick="triggerAdminPanel()">👤</div>
      <h3 id="profileName">Piyush Patil <span class="blue-tick">🔵</span></h3>
      <p style="color:#888; font-size:14px;">App Developer & Admin</p>
    </div>
    <div class="grid" id="profile-grid"></div>
  </div>

  <!-- बॉटम नेव्हिगेशन -->
  <div class="bottom-nav">
    <div class="nav-btn" onclick="openPage('home-page')">🏠</div>
    <div class="nav-btn" onclick="openPage('reels-page')">🎬</div>
    <div class="nav-btn" onclick="openPage('upload-page')">➕</div>
    <div class="nav-btn" onclick="openPage('profile-page')">👤</div>
  </div>

  <script>
    let currentUploadType = 'post';
    let selectedMediaBase64 = null;
    let clickCount = 0;

    function openPage(id) {
      document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
      document.getElementById(id).style.display = 'block';
      
      // रील्स पेज सोडून इतर कुठेही गेल्यास रील व्हिडिओ बंद करणे
      document.querySelectorAll('video').forEach(v => v.pause());
      if(id === 'reels-page') {
        const firstVideo = document.querySelector('#reelsContainer video');
        if(firstVideo) firstVideo.play();
      }
    }

    function setUploadType(type) {
      currentUploadType = type;
      document.getElementById('typePostBtn').classList.toggle('active', type === 'post');
      document.getElementById('typeReelBtn').classList.toggle('active', type === 'reel');
      document.getElementById('uploadIcon').innerText = type === 'post' ? '🖼️' : '🎬';
      document.getElementById('fileInput').accept = type === 'post' ? 'image/*' : 'video/*';
    }

    function mediaSelected(input) {
      if(input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          selectedMediaBase64 = e.target.result;
          document.getElementById('uploadStatusText').innerText = "✓ Media Ready";
          document.getElementById('uploadStatusText').style.color = "#0095f6";
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function publishMedia() {
      if(!selectedMediaBase64) return alert("Please select a file first!");
      const caption = document.getElementById('postCaption').value || "No caption";

      if(currentUploadType === 'post') {
        // होम फीडमध्ये पोस्ट जाणे
        const feed = document.getElementById('live-feed');
        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `<div class="post-header"><div class="post-avatar">👤</div><div>@Piyush_Patil <span class="blue-tick">🔵</span></div></div><img class="post-img" src="${selectedMediaBase64}"><div class="post-actions"><span style="cursor:pointer;" onclick="this.innerText=this.innerText==='❤️'?'🤍':'❤️'">❤️</span></div><div style="padding:0 15px;"><b>@Piyush_Patil 🔵</b> ${caption}</div>`;
        feed.insertBefore(card, feed.firstChild);

        // प्रोफाईल ग्रिडमध्ये फोटो सिंक होणे
        const grid = document.getElementById('profile-grid');
        const item = document.createElement('div');
        item.className = 'grid-item';
        item.style.backgroundImage = `url('${selectedMediaBase64}')`;
        grid.insertBefore(item, grid.firstChild);
      } else {
        // रील्स कंटेनरमध्ये नवीन रील व्हिडिओ जाणे 🎬
        const reelsFeed = document.getElementById('reelsContainer');
        const reelCard = document.createElement('div');
        reelCard.className = 'reel-card';
        reelCard.innerHTML = `<video class="reel-video" src="${selectedMediaBase64}" loop muted autoplay onclick="this.paused ? this.play() : this.pause()"></video><div class="reel-overlay"><p>@Piyush_Patil <span class="blue-tick">🔵</span></p><span>${caption}</span></div>`;
        reelsFeed.insertBefore(reelCard, reelsFeed.firstChild);
      }

      alert("Published Successfully! 🚀");
      selectedMediaBase64 = null;
      document.getElementById('postCaption').value = "";
      document.getElementById('uploadStatusText').innerText = "Select from Gallery";
      document.getElementById('uploadStatusText').style.color = "#888";
      openPage(currentUploadType === 'post' ? 'home-page' : 'reels-page');
    }

    function uploadStoryLocal(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById('myStoryIcon').innerText = "";
          document.getElementById('myStoryIcon').style.backgroundImage = `url('${e.target.result}')`;
          alert("Story Live! 📸");
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // 🔵 SECRET ADMIN PANEL FOR BLUE TICK CONTROL
    function triggerAdminPanel() {
      clickCount++;
      if(clickCount === 3) {
        clickCount = 0;
        const username = prompt("Enter the username to give Verified Blue Tick (🔵):");
        if(username) {
          alert(`Success! @${username} is now verified 🔵`);
          // प्रोफाईलचं नाव असेल तर तिथे निळी टिक लावा
          if(username.toLowerCase() === 'piyush patil' || username.toLowerCase() === 'piyush') {
            document.getElementById('profileName').innerHTML = `${username} <span class="blue-tick">🔵</span>`;
          }
        }
      }
      setTimeout(() => { clickCount = 0; }, 3000); // Reset clicks after 3s
    }
  </script>
</body>
</html>
