<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PopX Pro - Master Edition</title>
  <style>
    :root { --bg: #000; --text: #fff; --accent: #0095f6; --card: #121212; --border: #262626; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 0; user-select: none; }
    .page { height: calc(100vh - 60px); overflow-y: auto; padding-bottom: 20px; box-sizing: border-box; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--border); background: #000; position: sticky; top: 0; z-index: 2000; }
    .logo { font-weight: bold; font-size: 26px; font-style: italic; background: linear-gradient(45deg, #f09433, #dc2743); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; font-size: 24px; z-index: 2000; height: 60px; box-sizing: border-box; }
    .nav-btn { cursor: pointer; }
    .stories-bar { display: flex; gap: 12px; padding: 12px; border-bottom: 1px solid #1c1c1e; align-items: center; }
    .story-ring { width: 62px; height: 62px; border-radius: 50%; border: 2px solid #dc2743; padding: 2px; flex-shrink: 0; cursor: pointer; position: relative; }
    .story-user { width: 100%; height: 100%; border-radius: 50%; background: #262626; display: flex; justify-content: center; align-items: center; font-size: 22px; background-size: cover; background-position: center; }
    .post-card { padding: 15px 0; border-bottom: 1px solid #1c1c1e; }
    .post-header { display: flex; align-items: center; padding: 0 15px 10px 15px; font-weight: bold; font-size: 14px; }
    .post-img { width: 100%; background: #111; display: block; object-fit: contain; max-height: 450px; }
    .post-actions { padding: 10px 15px 5px 15px; display: flex; gap: 15px; font-size: 24px; }
    .blue-tick { color: #0095f6; font-size: 14px; margin-left: 3px; }
    .comment-box { background: #121212; padding: 10px; margin: 10px 15px; border-radius: 8px; display: none; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; }
    .grid-item { aspect-ratio: 1/1; background-color: #1c1c1e; background-size: cover; background-position: center; }
    .btn-follow { background: #0095f6; border: none; color: white; padding: 5px 12px; border-radius: 5px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .reels-video { width: 100%; height: 100vh; object-fit: cover; }
  </style>
</head>
<body>

  <div id="home-page" class="page">
    <div class="header"><div class="logo">PopX Pro</div></div>
    <div class="stories-bar">
      <div class="story-ring" onclick="document.getElementById('storyInput').click()">
        <div class="story-user" id="myStoryIcon">🙋‍♂️</div>
      </div>
      <input type="file" id="storyInput" style="display:none;" onchange="updateStory(this)">
      <div class="story-ring"><div class="story-user">🐱</div></div>
    </div>
    <div id="feed">
      <div class="post-card">
        <div class="post-header">👤 @piyush_creator <span class="blue-tick">🔵</span></div>
        <img class="post-img" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500">
        <div class="post-actions"><span onclick="toggleLike(this)">❤️</span> <span onclick="alert('Comments...')">💬</span></div>
        <div style="padding: 0 15px; font-size: 14px;"><b>@piyush_creator</b> Master Edition Live! 🚀</div>
      </div>
    </div>
  </div>

  <div id="reels-page" class="page" style="display:none; padding:0;">
    <video class="reels-video" src="https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-sign-light-40492-large.mp4" autoplay loop muted></video>
  </div>

  <div id="profile-page" class="page" style="display:none;">
    <div style="text-align:center; padding:20px;">
      <div class="story-user" style="width:90px; height:90px; margin:auto; margin-bottom:10px; border:2px solid #333;">👤</div>
      <h3>Piyush Patil <span class="blue-tick">🔵</span></h3>
    </div>
    <div class="grid" id="profile-grid"></div>
  </div>

  <div class="bottom-nav">
    <div class="nav-btn" onclick="showPage('home-page')">🏠</div>
    <div class="nav-btn" onclick="showPage('reels-page')">🎬</div>
    <div class="nav-btn" onclick="alert('Upload from Post button')">➕</div>
    <div class="nav-btn" onclick="showPage('profile-page')">👤</div>
  </div>

  <script>
    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
      document.getElementById(id).style.display = 'block';
    }
    function updateStory(input) {
      const reader = new FileReader();
      reader.onload = e => document.getElementById('myStoryIcon').style.backgroundImage = `url('${e.target.result}')`;
      reader.readAsDataURL(input.files[0]);
    }
    function toggleLike(el) { el.style.color = el.style.color === 'red' ? 'white' : 'red'; }
  </script>
</body>
</html>
