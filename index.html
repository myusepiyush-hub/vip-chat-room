<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PopX Pro V6 - Ultimate Social OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #000; color: #fff; font-family: -apple-system, sans-serif; }
    .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 80px; }
    .active-page { display: block; }
    .nav-btn:hover { color: #0095f6; }
    .notif-pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<!-- Pages -->
<div id="home" class="page active-page">
  <div class="p-4 flex justify-between items-center border-b border-gray-800">
    <h1 class="text-2xl font-bold italic">PopX Pro V6</h1>
    <div class="flex gap-4"><span onclick="triggerNotif()">🔔</span><span>📨</span></div>
  </div>
  <div id="feed" class="p-4 space-y-6"></div>
</div>

<div id="explore" class="page">
  <div class="p-4"><input class="w-full bg-gray-900 p-3 rounded-xl border border-gray-700" placeholder="🔎 Global Search..."></div>
  <div id="exp-grid" class="grid grid-cols-3 gap-1"></div>
</div>

<div id="reels" class="page">
  <div id="reels-list" class="h-full snap-y snap-mandatory overflow-y-scroll"></div>
</div>

<div id="upload" class="page p-6">
  <h2 class="text-2xl font-bold mb-6">Studio Core</h2>
  <div class="border-2 border-dashed border-gray-700 p-10 text-center rounded-xl" onclick="document.getElementById('fileIn').click()">Upload Media</div>
  <input type="file" id="fileIn" class="hidden" onchange="previewMedia(this)">
  <input id="captionInput" class="w-full bg-gray-900 p-3 mt-4 rounded" placeholder="AI-Powered Caption...">
  <button onclick="broadcast()" class="w-full mt-6 bg-blue-600 p-4 rounded-xl font-bold">Publish to Global Feed 🚀</button>
</div>

<div id="profile" class="page">
  <div class="p-6 text-center">
    <div class="w-24 h-24 bg-gray-800 rounded-full mx-auto mb-4 border-2 border-blue-500"></div>
    <h2 class="text-xl font-bold" id="pUName">viralaaba</h2>
    <div class="flex justify-around py-4">
      <div><span class="block font-bold" id="postCount">0</span>Posts</div>
      <div><span class="block font-bold">148K</span>Followers</div>
    </div>
    <div class="flex gap-2">
      <button class="w-full bg-gray-800 p-2 rounded-lg font-bold">Edit Profile</button>
      <button class="w-full bg-gray-800 p-2 rounded-lg font-bold">Share</button>
    </div>
  </div>
  <div id="p-grid" class="grid grid-cols-3 gap-1"></div>
</div>

<!-- Nav -->
<div class="fixed bottom-0 w-full bg-black border-t border-gray-800 flex justify-around p-4 text-2xl">
  <div onclick="show('home')">🏠</div>
  <div onclick="show('explore')">🔍</div>
  <div onclick="show('reels')">🎬</div>
  <div onclick="show('upload')">➕</div>
  <div onclick="show('profile')">👤</div>
</div>

<script>
  // Background Notification Engine
  setInterval(() => {
    if (Math.random() > 0.8) {
      console.log("Background Notification: New trend started in N/TV!");
      // Logic for system-wide toast notification could go here
    }
  }, 10000);

  function show(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
    document.getElementById(id).classList.add('active-page');
  }

  function broadcast() {
    const cap = document.getElementById('captionInput').value;
    alert("Broadcasting: " + cap + " | Syncing to Background Services...");
    document.getElementById('postCount').innerText = parseInt(document.getElementById('postCount').innerText) + 1;
    show('home');
  }

  function triggerNotif() {
    alert("🔔 PopX System: You have 3 pending interaction requests!");
  }

  function previewMedia(input) { alert("Media successfully uploaded to local cloud!"); }
</script>
</body>
</html>
